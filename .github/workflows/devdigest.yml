# Generated by DevDigest — export-to-CI (specs/14-export-to-ci.md).
# Edits are safe: re-running "Update CI config" in DevDigest will overwrite
# this file with a fresh generation from the agent's current configuration.

name: DevDigest Review
on:
  pull_request:
    types:
      - opened
      - synchronize
jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Run DevDigest review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEVDIGEST_POST_AS: github_review
        run: node .devdigest/runner/index.js
      - name: Write run metadata
        if: always()
        env:
          DEVDIGEST_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          DEVDIGEST_REPOSITORY: ${{ github.repository }}
          DEVDIGEST_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node -e "const fs=require('fs');fs.writeFileSync('devdigest-run.json',JSON.stringify({commit_sha:process.env.DEVDIGEST_COMMIT_SHA,repository:process.env.DEVDIGEST_REPOSITORY,pr_number:Number(process.env.DEVDIGEST_PR_NUMBER)}));"
      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devdigest-result
          path: |
            devdigest-result.json
            devdigest-run.json
          if-no-files-found: warn
